<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="my-day-release" content="20261115-pages-2">
  <meta name="description" content="MY DAY 本地记录版，记录与照片保存在当前浏览器，支持备份与离线使用。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MY DAY">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="./update.js?v=20261115-pages-2"></script>
  <link rel="preload" href="./noto-sans-sc-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./nunito-900-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css?v=20261115-pages-2">
  <title>MY DAY · 日常记录</title>
</head>
<body>
  <div id="app"><div class="loading">MY DAY<span>正在打开你的日常</span></div></div>
  <dialog id="sheet" aria-label="编辑"><div id="sheet-content"></div></dialog>
  <dialog id="picker" aria-label="选择"><div id="picker-content"></div></dialog>
  <dialog id="confirmation" aria-label="确认"><div id="confirm-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden multiple>
  <input id="album-input" type="file" accept="image/*" hidden multiple>
  <input id="import-input" type="file" accept="application/json,.json" hidden>
  <script src="./app.js?v=20261115-pages-2" type="module"></script>
</body>
</html>
